<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>A股周期</title>
<style>
@font-face {
  font-family: 'Chakra Petch';
  src: url('../../assets/fonts/ChakraPetch-Bold.ttf') format('truetype');
  font-weight: 700;
  font-display: swap;
}
:root {
  --ink: #e8f0ff;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body {
  width: 100%;
  height: 100%;
  margin: 0;
  overflow: hidden;
  background: transparent;
  font-family: 'Chakra Petch', sans-serif;
  user-select: none;
}
.tf {
  position: absolute;
  bottom: 0;
  left: 0;
  width: auto;
  height: 31.17%;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 0;
  overflow: hidden;
  -webkit-mask-image: linear-gradient(to bottom, transparent 0%, #000 20.833%, #000 79.167%, transparent 100%);
  mask-image: linear-gradient(to bottom, transparent 0%, #000 20.833%, #000 79.167%, transparent 100%);
}
.tf .period {
  border: 0;
  background: none;
  padding: 0 clamp(4px, 1vw, 8px);
  width: auto;
  display: block;
  height: auto;
  min-height: 0;
  font: 700 clamp(28px, 4.3vh, 44px)/1.05 'Chakra Petch', sans-serif;
  color: var(--ink);
  cursor: default;
  -webkit-tap-highlight-color: transparent;
  filter:
    drop-shadow(0 0 12px rgba(46,230,166,.7))
    drop-shadow(0 10px 14px rgba(0,0,0,.6));
}
</style>
</head>
<body>
<div class="tf" role="group" aria-label="周期">
  <span class="period" aria-current="true">1D</span>
</div>
<script>
(() => {
  const period = document.querySelector('.tf .period');
  const valid = '1D';
  let ready = false;

  const setFromParent = value => {
    if (value !== valid) return;
    period.setAttribute('aria-current', 'true');
  };

  window.addEventListener('message', event => {
    if (event.origin !== location.origin || event.source !== window.parent) return;
    const data = event.data;
    if (!data || typeof data !== 'object' || data.type !== 'VEGAS_TIMEFRAME_SET') return;
    setFromParent(data.timeframe);
  });

  const announceReady = () => {
    if (ready) return;
    ready = true;
    setFromParent('1D');
    window.parent.postMessage({ type: 'VEGAS_TIMEFRAME_READY', timeframe: '1D' }, location.origin);
  };

  if (document.readyState === 'complete') announceReady();
  else window.addEventListener('load', announceReady, { once: true });
  window.addEventListener('pageshow', announceReady);
})();
</script>
</body>
</html>

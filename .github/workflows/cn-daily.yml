name: CN Daily Scan and Deploy
on:
  schedule:
    - cron: "35 7 * * 1-5"
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: cn-daily-production
  cancel-in-progress: false
jobs:
  scan:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    outputs:
      deploy: ${{ steps.gate.outputs.deploy }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Test data and signal rules
        run: python -m unittest discover -s tests -v
      - name: Verify official exchange calendar
        id: calendar
        run: python scripts/trading_calendar.py --write site/data/trading-calendar.json --github-output "$GITHUB_OUTPUT"
      - name: Enforce completed daily session
        if: steps.calendar.outputs.is-trading-day == 'true'
        run: |
          python - <<'PY'
          from datetime import datetime,time
          from zoneinfo import ZoneInfo
          now=datetime.now(ZoneInfo("Asia/Shanghai"))
          if now.time().replace(tzinfo=None)<time(15,30): raise SystemExit("Market is not closed")
          PY
      - name: Scan complete Tencent QFQ CN500 daily history
        if: steps.calendar.outputs.is-trading-day == 'true'
        run: python scripts/daily_scan.py --workers 6
      - name: Validate complete published payload
        if: steps.calendar.outputs.is-trading-day == 'true'
        run: |
          python - <<'PY'
          import json
          s=json.load(open("site/data/summary.json"))
          assert s["symbols_ok"]==500 and s["universe_total"]==500 and s["data_status"]=="complete"
          assert s["frequency"]=="1D" and s["ema_periods"]==[12,144,169,576,676]
          PY
      - name: Restore today's independent Bark dedupe state
        id: bark-restore
        if: steps.calendar.outputs.is-trading-day == 'true'
        uses: actions/cache/restore@v4
        with:
          path: .cache/cn-bark
          key: cn-bark-${{ steps.calendar.outputs.trade-date }}
      - name: Push CN independent Bark notification
        if: steps.calendar.outputs.is-trading-day == 'true'
        env:
          CN_BARK_KEY: ${{ secrets.CN_BARK_KEY || secrets.A_SHARE_BARK_KEY }}
          CN_BARK_SERVER: ${{ secrets.CN_BARK_SERVER || secrets.BARK_SERVER }}
        run: python scripts/push_bark.py
      - name: Save today's Bark dedupe state
        if: steps.calendar.outputs.is-trading-day == 'true' && steps.bark-restore.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: .cache/cn-bark
          key: cn-bark-${{ steps.calendar.outputs.trade-date }}
      - name: Upload verified Pages site
        if: steps.calendar.outputs.is-trading-day == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Set deployment gate
        id: gate
        run: echo "deploy=${{ steps.calendar.outputs.is-trading-day == 'true' }}" >> "$GITHUB_OUTPUT"
  deploy:
    needs: scan
    if: needs.scan.outputs.deploy == 'true'
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment

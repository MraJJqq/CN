name: CN A-share Daily Cache and Publish
# Tencent scans are independent from frontend-only Pages releases.
on:
  workflow_dispatch:
  schedule:
    # 16:30 China Standard Time, after the A-share cash market closes.
    - cron: "30 8 * * 1-5"
concurrency:
  group: cn-a-share-daily
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  scan-and-cache:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    outputs:
      has-data: ${{ steps.scan.outcome == 'success' && steps.validate.outcome == 'success' && steps.calendar.outputs.is-trading-day == 'true' }}
    steps:
      - uses: actions/checkout@v7
      - name: Gate manual scans until after the A-share close
        id: scan-window
        if: github.event_name == 'workflow_dispatch'
        run: |
          allowed=$(python -c 'from datetime import datetime,time; from zoneinfo import ZoneInfo; now=datetime.now(ZoneInfo("Asia/Shanghai")); print(str(now.time().replace(tzinfo=None) >= time(15,30)).lower())')
          echo "allowed=$allowed" >> "$GITHUB_OUTPUT"
          echo "Manual scan gate (15:30 China time): $allowed"
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Audit Python dependencies
        run: |
          python -m pip install pip-audit
          pip-audit -r requirements.txt
      - name: Test backend data and frontend system contracts
        run: python -m unittest discover -s tests -v
      - name: Check A-share trading calendar
        id: calendar
        run: python scripts/trading_calendar.py --write site/data/trading-calendar.json --github-output "$GITHUB_OUTPUT"
      - name: Restore Tencent CN500 cache
        uses: actions/cache/restore@v6
        with:
          path: .cache/cn500-tencent-qfq
          key: cn-cn500-tencent-qfq-v5-${{ github.run_id }}
          restore-keys: |
            cn-cn500-tencent-qfq-v5-
      - name: Backfill or incrementally update Tencent daily history
        id: scan
        if: steps.calendar.outputs.is-trading-day == 'true' && (github.event_name != 'workflow_dispatch' || steps.scan-window.outputs.allowed == 'true')
        run: python scripts/a_share_cache.py --workers 4 --cache-dir .cache/cn500-tencent-qfq
      - name: Validate complete Pages data payload
        id: validate
        if: steps.scan.outcome == 'success' && steps.calendar.outputs.is-trading-day == 'true'
        run: python scripts/validate_pages_payload.py
      - name: Check Bark credentials
        id: bark
        if: steps.scan.outcome == 'success' && steps.calendar.outputs.is-trading-day == 'true' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
        env:
          BARK_KEY: ${{ secrets.A_SHARE_BARK_KEY }}
        run: |
          if [ -n "$BARK_KEY" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
            echo "Bark credentials are configured."
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Bark push is disabled: confirm the repository Actions secret A_SHARE_BARK_KEY in Settings > Secrets and variables > Actions."
          fi
      - name: Push CN500 daily signals to Bark
        id: bark-push
        if: steps.scan.outcome == 'success' && steps.calendar.outputs.is-trading-day == 'true' && steps.bark.outputs.configured == 'true' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
        continue-on-error: true
        env:
          BARK_KEY: ${{ secrets.A_SHARE_BARK_KEY }}
          BARK_SERVER: ${{ secrets.BARK_SERVER }}
          BARK_DEDUPE_DIR: .cache/cn500-tencent-qfq
        run: python scripts/push_signals.py
      - name: Save Tencent cache snapshot
        if: always() && steps.scan.outcome != 'cancelled' && steps.scan.outcome != 'skipped'
        uses: actions/cache/save@v6
        with:
          path: .cache/cn500-tencent-qfq
          key: cn-cn500-tencent-qfq-v5-${{ github.run_id }}
      - name: Upload diagnostics and cache manifest
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: cn-a-share-${{ github.run_number }}
          path: |
            results/a-share/
            site/data/
          if-no-files-found: warn
          retention-days: 90
      - name: Package Pages site
        if: steps.scan.outcome == 'success' && steps.validate.outcome == 'success' && steps.calendar.outputs.is-trading-day == 'true'
        uses: actions/upload-pages-artifact@v5
        with:
          path: site
      - name: Mark workflow failed when Bark push fails
        if: steps.bark-push.outcome == 'failure'
        run: |
          echo "::error::Bark push failed; Pages data is still deployed, but notification delivery needs attention."
          exit 1
  deploy:
    needs: scan-and-cache
    if: always() && needs.scan-and-cache.outputs.has-data == 'true' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    concurrency:
      group: cn-pages-deploy
      cancel-in-progress: false
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v6
      - name: Deploy CN to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

name: CN A-share Daily Cache and Publish
run-name: CN daily scan (${{ github.event_name == 'schedule' && 'scheduled' || inputs.recovery_slot || 'manual' }})
on:
  workflow_dispatch:
    inputs:
      recovery_slot:
        description: Watchdog recovery slot marker (leave empty for manual runs)
        required: false
        type: string
        default: ""
  schedule:
    - cron: "0 2 * * 1-5"
concurrency:
  group: cn-a-share-daily
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  scan-and-cache:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    outputs:
      has-data: ${{ steps.scan.outcome == 'success' && steps.validate.outcome == 'success' && steps.calendar.outputs.is-scan-day == 'true' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Audit Python dependencies
        run: |
          python -m pip install pip-audit
          pip-audit -r requirements.txt
      - name: Test backend data and frontend system contracts
        run: python -m unittest discover -s tests -v
      - name: Resolve latest completed A-share session
        id: calendar
        run: python scripts/trading_calendar.py --latest-completed-session --write site/data/trading-calendar.json --github-output "$GITHUB_OUTPUT"
      - name: Restore Tencent CN500 cache
        uses: actions/cache/restore@v6
        with:
          path: .cache/cn500-tencent-qfq
          key: cn-cn500-tencent-qfq-v5-${{ github.run_id }}
          restore-keys: |
            cn-cn500-tencent-qfq-v5-
      - name: Backfill or incrementally update Tencent daily history
        id: scan
        if: steps.calendar.outputs.is-scan-day == 'true'
        run: python scripts/a_share_cache.py --workers 4 --cache-dir .cache/cn500-tencent-qfq --as-of "${{ steps.calendar.outputs.trade-date }}"
      - name: Validate complete Pages data payload
        id: validate
        if: steps.scan.outcome == 'success' && steps.calendar.outputs.is-scan-day == 'true'
        run: python scripts/validate_pages_payload.py
      - name: Persist latest validated Pages snapshot
        if: steps.scan.outcome == 'success' && steps.validate.outcome == 'success' && steps.calendar.outputs.is-scan-day == 'true'
        continue-on-error: true
        run: |
          set -euo pipefail
          store="$RUNNER_TEMP/cn-data-store"
          git worktree add --detach "$store" HEAD
          git -C "$store" checkout --orphan cn-data
          mkdir -p "$store/site"
          cp -a site/data "$store/site/data"
          git -C "$store" config user.name "github-actions[bot]"
          git -C "$store" config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C "$store" add -A
          git -C "$store" commit -m "Persist latest validated CN market snapshot"
          git -C "$store" push --force origin HEAD:refs/heads/cn-data
          echo "Latest validated CN market snapshot persisted to cn-data."
      - name: Check Bark credentials
        id: bark
        if: steps.scan.outcome == 'success' && steps.calendar.outputs.is-scan-day == 'true' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
        env:
          BARK_KEY: ${{ secrets.A_SHARE_BARK_KEY }}
        run: |
          if [ -n "$BARK_KEY" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
            echo "Bark credentials are configured."
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Bark push is disabled: confirm the repository Actions secret A_SHARE_BARK_KEY in Settings > Secrets and variables > Actions."
          fi
      - name: Push CN500 daily signals to Bark
        id: bark-push
        if: steps.scan.outcome == 'success' && steps.calendar.outputs.is-scan-day == 'true' && steps.bark.outputs.configured == 'true' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
        continue-on-error: true
        env:
          BARK_KEY: ${{ secrets.A_SHARE_BARK_KEY }}
          BARK_SERVER: ${{ secrets.BARK_SERVER }}
          BARK_DEDUPE_DIR: .cache/cn500-tencent-qfq
          RECOVERY_SLOT: ${{ inputs.recovery_slot }}
        run: python scripts/push_signals.py
      - name: Save Tencent cache snapshot
        if: always() && steps.scan.outcome != 'cancelled' && steps.scan.outcome != 'skipped'
        uses: actions/cache/save@v6
        with:
          path: .cache/cn500-tencent-qfq
          key: cn-cn500-tencent-qfq-v5-${{ github.run_id }}
      - name: Upload diagnostics and cache manifest
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: cn-a-share-${{ github.run_number }}
          path: |
            results/a-share/
            site/data/
          if-no-files-found: warn
          retention-days: 90
      - name: Package Pages site
        if: steps.scan.outcome == 'success' && steps.validate.outcome == 'success' && steps.calendar.outputs.is-scan-day == 'true'
        uses: actions/upload-pages-artifact@v5
        with:
          path: site
      - name: Mark workflow failed when Bark push fails
        if: steps.bark-push.outcome == 'failure'
        run: |
          echo "::error::Bark push failed; Pages data is still deployed, but notification delivery needs attention."
          exit 1
  deploy:
    needs: scan-and-cache
    if: always() && needs.scan-and-cache.outputs.has-data == 'true' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    concurrency:
      group: cn-pages-deploy
      cancel-in-progress: false
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v6
      - name: Deploy CN to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

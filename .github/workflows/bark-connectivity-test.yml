name: CN Bark Connectivity Test
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  bark-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Send one Bark connectivity test
        env:
          BARK_KEY: ${{ secrets.A_SHARE_BARK_KEY }}
          BARK_SERVER: ${{ secrets.BARK_SERVER }}
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.request

          key = os.environ.get("BARK_KEY", "").strip()
          if not key:
              raise SystemExit("A_SHARE_BARK_KEY is not configured in repository Actions secrets.")
          server = os.environ.get("BARK_SERVER", "").strip().rstrip("/") or "https://api.day.app"
          payload = json.dumps({
              "device_key": key,
              "title": "CN Bark connectivity test",
              "body": "CN Bark connection is working.",
              "level": "active",
          }).encode("utf-8")
          request = urllib.request.Request(
              f"{server}/push",
              data=payload,
              headers={"Content-Type": "application/json; charset=utf-8"},
              method="POST",
          )
          with urllib.request.urlopen(request, timeout=20) as response:
              result = json.loads(response.read().decode("utf-8", "replace"))
              if response.status < 200 or response.status >= 300 or result.get("code") != 200:
                  raise SystemExit(f"Bark rejected connectivity test: HTTP {response.status}; code={result.get('code')}")
              print("Bark connectivity test accepted by server.")
          PY

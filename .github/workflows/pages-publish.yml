name: CN Pages Frontend Publish
# Publish frontend-only changes without invoking the Tencent CN500 scan.
on:
  push:
    branches: [main]
    paths:
      - "site/**"
  workflow_dispatch:
permissions:
  actions: read
  contents: read
  pages: write
  id-token: write
concurrency:
  group: cn-pages-deploy
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install validator dependency
        run: python -m pip install "requests>=2.31,<3"
      - uses: actions/configure-pages@v6
      - name: Restore the newest internally valid A-share data snapshot
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          restored=0
          mkdir -p .cn-data-candidates
          while read -r run_id run_number; do
            [ -n "$run_id" ] || continue
            candidate=".cn-data-candidates/run-$run_number"
            rm -rf "$candidate"
            if ! gh run download "$run_id" --name "cn-a-share-$run_number" --dir "$candidate"; then
              echo "Skipping run $run_number: data artifact unavailable."
              continue
            fi
            if [ ! -d "$candidate/site/data" ]; then
              echo "Skipping run $run_number: artifact has no site/data snapshot."
              continue
            fi
            if ! python3 scripts/validate_pages_payload.py --allow-previous-snapshot --data-dir "$candidate/site/data"; then
              echo "Skipping run $run_number: snapshot failed full integrity validation."
              continue
            fi
            rm -rf site/data
            mkdir -p site
            cp -a "$candidate/site/data" site/data
            echo "Restored internally valid A-share snapshot from run $run_number."
            restored=1
            break
          done < <(gh run list --workflow a-share-daily.yml --branch main --limit 1000 --json databaseId,number,status,conclusion --jq '.[] | select(.status == "completed" and .conclusion == "success") | "\(.databaseId) \(.number)"')
          if [ "$restored" -ne 1 ]; then
            echo "No internally valid A-share Pages data snapshot found; refusing to publish an incomplete site."
            exit 1
          fi
      - name: Upload current Pages site
        uses: actions/upload-pages-artifact@v5
        with:
          path: site
      - name: Deploy CN frontend
        id: deployment
        uses: actions/deploy-pages@v5
